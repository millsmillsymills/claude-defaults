name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    env:
      SHFMT_VERSION: v3.13.1
      SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install shfmt
        run: |
          url="https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          curl -fsSL "$url" -o /usr/local/bin/shfmt
          echo "${SHFMT_SHA256}  /usr/local/bin/shfmt" | sha256sum -c -
          chmod +x /usr/local/bin/shfmt

      - name: shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -x

      - name: shfmt
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shfmt -i 2 -d

      - name: tests
        run: bash tests/run-all.sh
