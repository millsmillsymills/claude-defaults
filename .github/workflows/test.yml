name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    env:
      SHFMT_VERSION: v3.13.1
      SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
      # Pin shellcheck so CI matches the version used locally; the runner's
      # preinstalled build is older and flags info-level notes 0.11 dropped.
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install shfmt
        run: |
          url="https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          curl -fsSL "$url" -o /usr/local/bin/shfmt
          echo "${SHFMT_SHA256}  /usr/local/bin/shfmt" | sha256sum -c -
          chmod +x /usr/local/bin/shfmt

      - name: Install shellcheck
        run: |
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" -o /tmp/shellcheck.tar.xz
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: shellcheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -x

      - name: shfmt
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shfmt -i 2 -d

      - name: tests
        run: bash tests/run-all.sh
